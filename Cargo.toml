[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/hawkff/nsxiv-ng"

[workspace.dependencies]
nsxiv-ng-core = { path = "crates/core", version = "0.0.1" }
nsxiv-ng-decode = { path = "crates/decode", version = "0.0.1" }
nsxiv-ng-edit = { path = "crates/edit", version = "0.0.1" }
nsxiv-ng-helper = { path = "crates/helper", version = "0.0.1" }
nsxiv-ng-linux = { path = "crates/linux", version = "0.0.1" }
nsxiv-ng-macos = { path = "crates/macos", version = "0.0.1" }
nsxiv-ng-render = { path = "crates/render", version = "0.0.1" }
nsxiv-ng-session = { path = "crates/session", version = "0.0.1" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
